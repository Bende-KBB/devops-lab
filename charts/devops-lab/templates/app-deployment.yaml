# The app as a Deployment: Kubernetes keeps 2 pods of it running.
#   kubectl apply -f kubernetes/app-deployment.yaml
apiVersion: apps/v1  # Deployments belong to the "apps" part of the API
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}  # "Helm": marks the object as Helm-managed
spec:
  replicas: {{ .Values.replicas }}  # desired number of pods
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-lab  # this Deployment's pods carry this label
  template:  # every pod is created from this template
    metadata:
      labels:
        app.kubernetes.io/name: devops-lab  # must match the selector above
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}  # where server.js listens
          readinessProbe:  # ready for traffic? if not: removed from the Service, not restarted
            httpGet:
              path: /
              port: {{ .Values.port }}
            periodSeconds: 2  # check every 2s
          livenessProbe:   # still alive? if not, 3 times in a row: the container is restarted
            httpGet:
              path: /
              port: {{ .Values.port }}
            periodSeconds: 10    # check every 10s
            failureThreshold: 3  # restart only after ~30s of failures