# Cloudflare tunnel connectors: carry devops-pipe.live's traffic into the cluster.
#   Token (never in Git): kubectl create secret generic tunnel-token --from-env-file=tunnel.env
#   kubectl apply -f kubernetes/tunnel-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
spec:
  replicas: 2  # two connectors: one can fail while the other serves
  selector:
    matchLabels:
      app.kubernetes.io/name: tunnel  # NOT the app's label: the Service must never pick these pods
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5  # 2026.10.1
          args: ["tunnel", "run"]  # named tunnel: routes are set in the Cloudflare dashboard
          envFrom:
            - secretRef:
                name: tunnel-token  # provides TUNNEL_TOKEN