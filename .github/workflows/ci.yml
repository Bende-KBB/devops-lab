# Continuous integration: runs on every pull request.
name: CI

on:
  pull_request:

# The automatic token may only read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Copy the repository onto the runner.
      # Pinned by commit SHA; the comment names the version for humans.
      - name: Check out the repository
        uses: actions/checkout@<3d3c42e5aac5ba805825da76410c181273ba90b1> # v7.0.1

      - name: Build the image
        run: docker build -t devops-lab:ci .