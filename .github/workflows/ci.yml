name: CI

on:
  pull_request:   # runs on every pull request

permissions:
  contents: read  # The automatic token may only read the repository.

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Copy the repository onto the runner. Pinned by commit SHA.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and Start the app   # Only the app, exactly as configured in compose.yaml
        run: docker compose up -d app