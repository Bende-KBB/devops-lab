name: CI

on:
  pull_request:   # every pull request: opened or updated
  workflow_call:  # other workflows can call this one
    inputs:
      save-image:
        description: Save the tested image as an artifact of this run
        type: boolean
        default: false

permissions:
  contents: read  # the automatic token can only read the repository

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # stop the job if anything hangs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build and start the app, wait until healthy
        run: docker compose up --wait app  # the app only, never the tunnel

      - name: Run the smoke test
        run: docker compose run --rm smoke-test

      - name: Save the tested image to a file
        if: inputs.save-image
        run: docker save --output devops-lab-app.tar devops-lab-app
      
      - name: Upload the tested image as an artifact
        if: inputs.save-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: devops-lab-app-image
          path: devops-lab-app.tar
          retention-days: 1         # only needed during this run
          if-no-files-found: error  # a missing file fails the step

      - name: Show the app's logs if a step failed
        if: failure()
        run: docker compose logs app
