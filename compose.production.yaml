# Production: compose.yaml plus these changes.
# Run every command with both files:
#   docker compose -f compose.yaml -f compose.production.yaml <command>
services:
  tunnel:
    image: cloudflare/cloudflared@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5  # 2026.10.1
    command: ["tunnel", "run"]  # named tunnel: routes are set in the Cloudflare dashboard
    env_file:
      - path: tunnel.env    # TUNNEL_TOKEN=...: secret, ignored by Git
        required: false     # fresh clones have no token
    depends_on:
      - app
